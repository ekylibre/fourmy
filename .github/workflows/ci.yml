name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: fourmy
          POSTGRES_PASSWORD: fourmy
          POSTGRES_DB: fourmy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fourmy -d fourmy"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://fourmy:fourmy@localhost:5432/fourmy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
