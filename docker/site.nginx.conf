# fourmy.org : site statique. Seul /api/public/ (formulaire de contact) est
# relayé vers l'API ; le reste de l'API n'est pas joignable par ce domaine.

# www.fourmy.org → fourmy.org (domaine canonique).
server {
  listen 80;
  server_name www.fourmy.org;
  return 301 https://fourmy.org$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  # Redirections relatives (/contact → /contact/) : derrière le proxy HTTPS,
  # une adresse absolue partirait en http://.
  absolute_redirect off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/public/ {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ { return 404; }

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Page retirée en novembre 2026 : les liens existants mènent aux fonctionnalités.
  location ~ ^/roadmap/?$ { return 301 /fonctionnalites/; }
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
}
