# Déploiement Fourmy (Dokploy, ou tout hôte Docker) — docs/deploiement.md.
# Les valeurs viennent de l'environnement (variables Dokploy) ; aucun secret
# dans le dépôt. Seul `web` est exposé : il sert l'application et relaie /api.
name: fourmy

services:
  db:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fourmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-fourmy}
    volumes:
      - fourmy_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fourmy} -d ${POSTGRES_DB:-fourmy}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fourmy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fourmy}
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET requis (32 caractères au moins)}
      BETTER_AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL requis (ex. https://fourmy-dev.exemple.fr)}
      FOURMY_TRUSTED_ORIGINS: ${PUBLIC_URL}
      FOURMY_MOBILE_ORIGINS: ${FOURMY_MOBILE_ORIGINS:-zeromobile://}
      FOURMY_ALLOW_SIGNUP: "false"
      # Chiffrement des secrets d'intégration (jetons Traccar…) : 32 octets base64.
      # La perdre rend les secrets illisibles (à ressaisir dans Intégrations).
      FOURMY_SECRETS_KEY: ${FOURMY_SECRETS_KEY:?FOURMY_SECRETS_KEY requis (openssl rand -base64 32)}
      FOURMY_IFT_API_URL: ${FOURMY_IFT_API_URL:-https://ecoagri-pprd.api.agriculture.gouv.fr/ift/v5/api}
      # Routage tracteur (docs/routage-osrm.md) : service `osrm` ci-dessous ; sans réponse,
      # la trace du rejeu reste brute et les trajets des chantiers sont estimés à vol d'oiseau.
      FOURMY_OSRM_URL: ${FOURMY_OSRM_URL:-http://osrm:5000}
      # Formulaire de contact de fourmy.org (désactivé sans FOURMY_SMTP_HOST).
      FOURMY_SMTP_HOST: ${FOURMY_SMTP_HOST:-}
      FOURMY_SMTP_PORT: ${FOURMY_SMTP_PORT:-587}
      FOURMY_SMTP_USER: ${FOURMY_SMTP_USER:-}
      FOURMY_SMTP_PASSWORD: ${FOURMY_SMTP_PASSWORD:-}
      FOURMY_SMTP_FROM: ${FOURMY_SMTP_FROM:-}
      FOURMY_CONTACT_TO: ${FOURMY_CONTACT_TO:-contact@fourmy.org}
      # Traefik → nginx (site ou web) → API : deux proxys de confiance.
      FOURMY_TRUSTED_PROXY_HOPS: "2"
      # Imports Ekylibre depuis l'API : serveur des bases sources restaurées.
      EKYLIBRE_SOURCES_URL: ${EKYLIBRE_SOURCES_URL:-postgres://${POSTGRES_USER:-fourmy}:${POSTGRES_PASSWORD}@db:5432/}
      FOURMY_EKYLIBRE_UPLOADS_DIR: /var/lib/fourmy/ekylibre-uploads
      # Recherche Sirene de l'INSEE (assistant : identité de la ferme) ; vide, saisie manuelle.
      SIRENE_API_KEY: ${SIRENE_API_KEY:-}
      SIRENE_API_URL: ${SIRENE_API_URL:-https://api.insee.fr/api-sirene/4}
      # Applications OAuth déclarées d'avance (Aiffel, services maison) : JSON, voir docs/acces-externes.md.
      FOURMY_OAUTH_CLIENTS: ${FOURMY_OAUTH_CLIENTS:-}
      # agrirouter (cartes de modulation vers les machines) : désactivé sans identifiants.
      AGRIROUTER_CLIENT_ID: ${AGRIROUTER_CLIENT_ID:-}
      AGRIROUTER_CLIENT_SECRET: ${AGRIROUTER_CLIENT_SECRET:-}
      AGRIROUTER_APPLICATION_ID: ${AGRIROUTER_APPLICATION_ID:-}
      AGRIROUTER_SOFTWARE_VERSION_ID: ${AGRIROUTER_SOFTWARE_VERSION_ID:-}
      AGRIROUTER_REDIRECT_URI: ${AGRIROUTER_REDIRECT_URI:-${PUBLIC_URL}/agrirouter/callback}
      AGRIROUTER_ENVIRONMENT: ${AGRIROUTER_ENVIRONMENT:-production}
    # Cache des tuiles IGN (« Ma ferme », F4) : relu par l'API, rempli aussi par le worker.
    # Fichiers reçus d'agrirouter : rangés par le worker, téléchargés par l'API.
    volumes:
      - fourmy_ign_cache:/var/cache/fourmy/ign
      - fourmy_agrirouter_files:/var/cache/fourmy/agrirouter
      # Sauvegardes Ekylibre déposées (assistant) : reçues par l'API, restaurées par le worker.
      - fourmy_ekylibre_uploads:/var/lib/fourmy/ekylibre-uploads

  # Tâches de fond : intégrations des fermes (Traccar : chaque minute), Lexicon,
  # eau, IFT, météo, heures estimées des matériels, alertes d'entretien,
  # préchargement et quota du cache IGN, écoute des événements agrirouter
  # (une seule instance écoute, verrou en base).
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fourmy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fourmy}
      NODE_ENV: production
      FOURMY_SECRETS_KEY: ${FOURMY_SECRETS_KEY}
      # Reprise d'Ekylibre depuis l'assistant : bases jetables restaurées et migrées par le worker.
      EKYLIBRE_SOURCES_URL: ${EKYLIBRE_SOURCES_URL:-postgres://${POSTGRES_USER:-fourmy}:${POSTGRES_PASSWORD}@db:5432/}
      FOURMY_EKYLIBRE_UPLOADS_DIR: /var/lib/fourmy/ekylibre-uploads
      # agrirouter (cartes de modulation vers les machines) : désactivé sans identifiants.
      AGRIROUTER_CLIENT_ID: ${AGRIROUTER_CLIENT_ID:-}
      AGRIROUTER_CLIENT_SECRET: ${AGRIROUTER_CLIENT_SECRET:-}
      AGRIROUTER_APPLICATION_ID: ${AGRIROUTER_APPLICATION_ID:-}
      AGRIROUTER_SOFTWARE_VERSION_ID: ${AGRIROUTER_SOFTWARE_VERSION_ID:-}
      AGRIROUTER_REDIRECT_URI: ${AGRIROUTER_REDIRECT_URI:-${PUBLIC_URL}/agrirouter/callback}
      AGRIROUTER_ENVIRONMENT: ${AGRIROUTER_ENVIRONMENT:-production}
      # Référentiel phyto et IFT (docs/phyto.md) : serveurs publics par défaut.
      FOURMY_LEXICON_PACKAGES_URL: ${FOURMY_LEXICON_PACKAGES_URL:-}
      # Clé du bundle Lexicon « fourmy » (jeu AgroEDI pour les imports DAPLOS et Geofolia).
      FOURMY_LEXICON_API_KEY: ${FOURMY_LEXICON_API_KEY:-}
      FOURMY_IFT_API_URL: ${FOURMY_IFT_API_URL:-https://ecoagri-pprd.api.agriculture.gouv.fr/ift/v5/api}
      # Alertes d'entretien par e-mail (lien vers la page Entretien) : même SMTP que l'API.
      BETTER_AUTH_URL: ${PUBLIC_URL}
      FOURMY_SMTP_HOST: ${FOURMY_SMTP_HOST:-}
      FOURMY_SMTP_PORT: ${FOURMY_SMTP_PORT:-587}
      FOURMY_SMTP_USER: ${FOURMY_SMTP_USER:-}
      FOURMY_SMTP_PASSWORD: ${FOURMY_SMTP_PASSWORD:-}
      FOURMY_SMTP_FROM: ${FOURMY_SMTP_FROM:-}
      # Préchargement des tuiles IGN : quota disque (Go) et requêtes parallèles vers l'IGN.
      FOURMY_IGN_CACHE_MAX_GB: ${FOURMY_IGN_CACHE_MAX_GB:-20}
      FOURMY_IGN_PRELOAD_CONCURRENCY: ${FOURMY_IGN_PRELOAD_CONCURRENCY:-8}
    volumes:
      - fourmy_ign_cache:/var/cache/fourmy/ign
      - fourmy_agrirouter_files:/var/cache/fourmy/agrirouter
      # Sauvegardes Ekylibre déposées (assistant) : reçues par l'API, restaurées par le worker.
      - fourmy_ekylibre_uploads:/var/lib/fourmy/ekylibre-uploads

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Hors Dokploy (essai local) : décommenter pour publier le port.
    # ports:
    #   - "8080:80"

  # Routage tracteur (OSRM) : trajets siège ↔ parcelles des chantiers (assolement) et
  # recalage du rejeu. Graphe à préparer une fois sur le serveur dans le volume
  # `fourmy_osrm` (docker/osrm/prepare.sh, docs/deploiement.md « OSRM ») ; tant qu'il
  # manque, le service attend sans redémarrer en boucle et l'API estime les trajets.
  osrm:
    image: osrm/osrm-backend:v5.25.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/map.osrm.mldgr ]; then
          echo "OSRM : pas de graphe dans le volume fourmy_osrm (docker/osrm/prepare.sh), service en attente"
          exec sleep infinity
        fi
        echo "OSRM : graphe $$(cat /data/region 2>/dev/null)"
        exec osrm-routed --algorithm mld --max-matching-size 500 /data/map.osrm
    volumes:
      - fourmy_osrm:/data:ro

  # Site public fourmy.org (+ www → fourmy.org). Relaie /api/public/ seulement.
  # Image construite par la CI (historique Git complet, absent du clone de
  # Dokploy) : .github/workflows/ci.yml, job site-image.
  site:
    image: ${SITE_IMAGE:-ghcr.io/ekylibre/fourmy-site:main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  fourmy_pgdata:
  fourmy_ign_cache:
  fourmy_agrirouter_files:
  fourmy_ekylibre_uploads:
  # Nom fixe : préparé hors de Compose par docker/osrm/prepare.sh.
  fourmy_osrm:
    name: fourmy_osrm
