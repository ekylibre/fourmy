# Pile de développement Fourmy : une seule base (PostGIS + TimescaleDB).
services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: fourmy
      POSTGRES_PASSWORD: fourmy
      POSTGRES_DB: fourmy
    ports:
      # FOURMY_DB_PORT : autre port hôte si un PostgreSQL local occupe déjà 5432.
      - "${FOURMY_DB_PORT:-5432}:5432"
    volumes:
      - fourmy_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourmy -d fourmy"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Routage tracteur (OSRM) : recalage des trajets sur la route, itinéraires.
  # Données à préparer une fois : docker/osrm/prepare.sh (carte Geofabrik, profil tracteur).
  osrm:
    image: osrm/osrm-backend:v5.25.0
    command: osrm-routed --algorithm mld --max-matching-size 500 /data/map.osrm
    ports:
      - "${FOURMY_OSRM_PORT:-5000}:5000"
    volumes:
      - fourmy_osrm:/data:ro
    profiles: ["osrm"]

volumes:
  fourmy_pgdata:
  fourmy_osrm:
    external: true
