# Web Fourmy : application React (SPA) et relais vers l'API, sur une même
# origine (cookies de session better-auth, pas de CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Les tuiles et les modèles 3D peuvent être lourds.
  client_max_body_size 50m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Sauvegarde Ekylibre déposée (assistant, lot IM6) : jusqu'à 2 Go, relayée
  # en flux (sans tampon disque nginx), temps d'envoi généreux.
  location ~ ^/api/v1/farms/[^/]+/imports/ekylibre/upload$ {
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_body_timeout 3600s;
  }

  location = /health {
    proxy_pass http://api:3000/health;
  }

  # Version affichée en pied de menu : calculée par le site public (construit
  # par la CI avec l'historique Git, absent du clone de Dokploy). Résolution
  # du nom « site » à la demande : nginx démarre même si le site est absent,
  # la page affiche alors « Version de développement ».
  location = /version.json {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $site http://site;
    proxy_pass $site/version.json;
    proxy_set_header Host fourmy.org;
    proxy_intercept_errors on;
    error_page 502 503 504 = @no_version;
    add_header Cache-Control "no-cache";
  }
  location @no_version {
    return 404;
  }

  # Fichiers versionnés par Vite : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker (copie hors ligne) : toujours revérifié, pour qu'une
  # nouvelle version remplace l'ancienne dès la visite suivante.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Routes de l'application : index.html (jamais mis en cache).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
