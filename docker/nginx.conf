# Web Fourmy : application React (SPA) et relais vers l'API, sur une même
# origine (cookies de session better-auth, pas de CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Les tuiles et les modèles 3D peuvent être lourds.
  client_max_body_size 50m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /health {
    proxy_pass http://api:3000/health;
  }

  # Fichiers versionnés par Vite : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Routes de l'application : index.html (jamais mis en cache).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
