        fourmy: { s: oui, t: "DAPLOS, Geofolia, TéléPAC et Ekylibre, cinq campagnes", f: imports }
        mp: { s: nt }
        smag: { s: oui, t: "migration depuis Geofolia ou MesParcelles, 3 campagnes", u: *smag }
        geo: { s: oui, t: "reprise des « 3 campagnes précédentes »", u: *geo }
      - nom: Semences (catalogue, PMG, densité)
        fourmy: { s: oui, t: "catalogue officiel, PMG, semis en grains/m², mélanges", f: semences }
        mp: { s: nt }
        smag: { s: nt }
        geo: { s: nt }
      - nom: Échanges avec coopérative et négoce
        fourmy: { s: non }
        mp: { s: partiel, t: "données partagées avec vos partenaires", u: *mpD }
        smag: { s: oui, t: "bons d'apport et de livraison importés", u: *smag }
        geo: { s: partiel, t: "échange de données avec les partenaires", u: *geo }
      - nom: API ouverte aux logiciels tiers
        fourmy: { s: oui, t: "clés d'API et OAuth, documentation OpenAPI publique, droits par module et par activité", f: api }
        mp: { s: partiel, t: "« interopérabilité directe entre votre compte et vos autres outils »", u: *mpD }
        smag: { s: partiel, t: "connexion aux outils d'aide à la décision (Scopix, Xarvio…)", u: *smag }
        geo: { s: partiel, t: "API ISAGRI, mise en production après un partenariat", u: *isagriApi }
      - nom: Assistant IA connecté (MCP)
        fourmy: { s: oui, t: "serveur MCP : consultation et propositions d'interventions à valider", f: assistant-ia }
        mp: { s: nt }
        smag: { s: nt }
        geo: { s: nt }
      - nom: Équipe, conseiller
        fourmy: { s: oui, t: "rôles, lecture seule pour le conseiller, invitations", f: equipe }
        mp: { s: oui, t: "conseillers des Chambres ; accompagnement et formations payants", u: *mpTarifs }
        smag: { s: oui, t: "données partagées avec le technicien", u: *smag }
        geo: { s: partiel, t: "logiciel collaboratif", u: *geo }
