# Fonctionnalités présentées sur fourmy.org (page Fonctionnalités), classées par module dans
# l'ordre du menu de l'application.
# module : un id de `modules` ; status : disponible | en-test | a-venir ;
# capture : src/assets/captures/<capture>.png (apps/web/e2e/captures*.spec.ts) ; since : version d'arrivée.
modules:
  - id: tableau
    title: Tableau de bord et frise
    text: La ferme du jour, ou de n'importe quelle date.
  - id: cartes
    title: Cartes 2D, 3D et satellite
    text: Le parcellaire sur la photo IGN, le plan 3D de la ferme et le suivi des cultures depuis l'espace.
  - id: activites
    title: Activités et cultures
    text: Ce qui pousse sur chaque parcelle, et comment ça avance.
  - id: interventions
    title: Interventions
    text: Tous les travaux de la ferme, saisis au bureau ou au champ.
  - id: materiels
    title: Matériels et traces GPS
    text: Chaque tracteur et chaque outil, leurs heures, leur entretien et leurs parcours.
  - id: economie
    title: Économique
    text: Les prix de la ferme, les prix de référence et les marges de la campagne.
  - id: stocks
    title: Stocks, semences et cuverie
    text: Ce qui entre, ce qui sort, les semences et ce que contient chaque cuve.
  - id: reglementaire
    title: Réglementaire
    text: Les contrôles à la saisie et les registres tenus tout seuls.
  - id: ferme
    title: Ma ferme et équipe
    text: L'exploitation, ses sites, ses personnes et leurs heures.
  - id: interoperabilite
    title: Interopérabilité
    text: Les machines, les stations et les logiciels qui parlent à Fourmy.
features:
  - id: frise
    module: tableau
    title: La ferme à n'importe quelle date
    text: >-
      Une frise en haut de l'écran : faites-la glisser et toute la ferme revient à cette
      date — parcelles, cuves, stocks, interventions. Rien n'est écrasé, tout est daté.
    status: disponible
    capture: tableau-de-bord
    since: 0.17.0
  - id: carte
    module: cartes
    title: Carte et parcellaire dans le temps
    text: >-
      Parcelles sur la photo aérienne et la carte IGN, versionnées : une parcelle découpée
      ou agrandie garde son histoire, et les surfaces traitées restent justes.
    status: disponible
    capture: carte
    since: 0.8.0
  - id: plan-3d
    module: cartes
    title: Plan 3D de l'exploitation
    text: >-
      Relief et photo IGN, bâtiments à leur hauteur, arbres et lignes électriques, cuves
      qui se remplissent au fil des vendanges, cultures en rangs à la hauteur vue par
      satellite. Le rejeu des tracteurs suit l'avatar 3D et son outil attelé : la bande
      travaillée se colore derrière l'outil, la rampe se replie sur la route. Une barre de
      temps place le rejeu à l'instant voulu, en plein écran.
    status: disponible
    capture: accueil-3d
    since: 0.18.0
  - id: satellite
    module: cartes
    title: Suivi des cultures par satellite
    text: >-
      NDVI, NDRE et NDMI de chaque parcelle d'après les images Sentinel-2, avec votre compte
      Copernicus : courbe de la saison comparée aux années passées, image sur la carte, et
      signalement des parcelles probablement récoltées sans intervention saisie.
    status: en-test
    since: 0.68.0
  - id: croissance
    module: activites
    title: Stades et besoins en eau des cultures
    text: >-
      Les stades du maïs et des céréales prévus d'après les degrés-jours depuis le semis, et
      la réserve en eau de chaque parcelle jour après jour. Les irrigations se saisissent en
      millimètres et entrent dans le bilan.
    status: en-test
    since: 0.72.0
  - id: modulation
    module: cartes
    title: Cartes de modulation pour la console du tracteur
    text: >-
      Des zones tirées de l'image satellite, une dose par zone, puis l'export ISO-XML ou
      Shapefile, ou l'envoi par agrirouter. Depuis le plan de fumure, la carte garde la dose
      prévue en moyenne sur la parcelle.
    status: en-test
    since: 0.74.0
  - id: itineraires
    module: activites
    title: Itinéraires techniques
    text: >-
      La frise des travaux réalisés d'une parcelle sur la campagne ou la rotation, et celle
      d'une activité, toutes parcelles réunies, avec descente sur chaque parcelle. Pour
      préparer la campagne suivante, voir les itinéraires techniques de la ferme.
    status: disponible
    since: 0.111.0
  - id: interventions
    module: interventions
    title: Toutes les interventions, un seul formulaire
    text: >-
      Labour, semis, traitements, fertilisation, récolte, vendange, entretien du matériel :
      le formulaire s'adapte à ce que vous faites, chaque travail a son icône. Doses à
      l'hectare ou au total, engrais en kilos ou en litres, plusieurs périodes de travail,
      vos produits et matériels habituels proposés en premier. Utilisable sur téléphone, et
      rien ne se perd si le réseau coupe pendant l'enregistrement.
    status: disponible
    capture: intervention
    since: 0.19.0
  - id: interventions-carte
    module: interventions
    title: Les parcelles choisies sur la carte
    text: >-
      Cliquez les parcelles sur la photo aérienne, ou prenez-les toutes d'un geste ; dessinez
      la zone réellement traitée quand une parcelle ne l'est qu'en partie : la dose totale
      suit la surface exacte.
    status: disponible
    capture: intervention-carte
    since: 0.33.0
  - id: interventions-semaine
    module: interventions
    title: La semaine des travaux
    text: >-
      Les interventions de la semaine en liste, en kanban (planifiées, en cours, réalisées)
      ou en calendrier ; une recherche rapide retrouve un produit, une parcelle ou un
      matériel sur toute la campagne. Chaque liste de Fourmy se règle : vous choisissez
      les colonnes affichées.
    status: disponible
    capture: interventions-semaine
    since: 0.31.0
  - id: interventions-fiche
    module: interventions
    title: Fiche d'intervention et corrections tracées
    text: >-
      Chaque intervention a sa fiche : météo et conditions de pulvérisation, surface
      travaillée de chaque parcelle, attelages et parcours GPS, intrants avec le voyant de
      leur dose, contrôle réglementaire et IFT, et un bouton pour revoir le chantier en 3D.
      Une erreur de saisie se corrige ; le stock et le registre suivent, et l'historique
      garde la version d'avant.
    status: disponible
    capture: intervention-fiche
    since: 0.30.0
  - id: controle-phyto
    module: reglementaire
    title: Contrôle réglementaire des traitements
    text: >-
      En saisissant un traitement, Fourmy vérifie l'autorisation du produit sur la culture,
      la dose maximale, le nombre d'applications, la zone non traitée au bord des cours
      d'eau et les délais avant récolte et de ré-entrée, d'après le catalogue officiel
      E-Phy. Un feu rouge demande un motif, conservé avec l'intervention.
    status: disponible
    capture: controle-phyto
    since: 0.34.0
  - id: meteo-interventions
    module: interventions
    title: Météo des interventions
    text: >-
      La météo de chaque intervention est remplie toute seule (température, hygrométrie,
      vent, pluie), et les créneaux favorables à la pulvérisation des prochains jours
      s'affichent. Open-Meteo par défaut, ou votre clé OpenWeather ou meteoblue.
    status: disponible
    capture: meteo
    since: 0.35.0
  - id: stocks
    module: stocks
    title: Stocks tenus tout seuls
    text: >-
      Chaque intervention réalisée sort les produits du stock ; une récolte y entre, rangée
      en cuve ou au bâtiment. Un stock négatif est signalé, jamais caché.
    status: disponible
    capture: stocks
    since: 0.14.0
  - id: cuverie
    module: stocks
    title: Cuverie
    text: >-
      Chaque cuve, ce qu'elle contient, son millésime et son cépage, à n'importe quelle date.
    status: disponible
    capture: cuverie
    since: 0.17.0
  - id: registre
    module: reglementaire
    title: Registre phytosanitaire et IFT calculés
    text: >-
      Le registre se déduit des traitements saisis : rien à ressaisir. Export pour les
      contrôles, et l'IFT de la campagne calculé par le service du ministère.
    status: disponible
    capture: registre
    since: 0.7.0
  - id: registre-reglementaire
    module: reglementaire
    title: Registre phyto au format réglementaire 2027
    text: >-
      Le registre électronique tel que l'attend l'arrêté du 24 décembre 2025 : une ligne
      par produit et par parcelle, culture en code OEPP, stade BBCH, applicateur, mode de
      conduite bio, SIRET du détenteur. Les champs manquants sont signalés ligne par
      ligne ; export CSV aux intitulés officiels et JSON complet pour les enquêtes.
    status: disponible
    capture: registre-reglementaire
    since: 0.66.0
  - id: plan-fumure
    module: reglementaire
    title: Plan prévisionnel de fumure calculé
    text: >-
      La dose d'azote de chaque parcelle selon le référentiel régional, terme par terme et
      sources citées : besoin de la culture, reliquat, minéralisation, produits organiques.
      Maïs, céréales à paille et colza ; dose plafond pour les autres cultures. Un terme
      manquant est nommé, rien n'est supposé. La dose d'un outil ou d'un conseiller peut
      la remplacer, et chaque version établie reste figée. Nouvelle-Aquitaine pour commencer.
    status: en-test
    since: 0.77.0
  - id: cahier-fertilisation
    module: reglementaire
    title: Cahier de fertilisation et directive nitrates
    text: >-
      Le cahier d'enregistrement se déduit des interventions, prêt à imprimer ou en CSV,
      apports d'automne compris. À la
      saisie d'un épandage, Fourmy vérifie le calendrier d'interdiction, le plan, les
      couverts d'interculture, l'azote libéré avant l'hiver et les conditions du jour ; un
      épandage interdit demande un motif, conservé avec l'intervention. Une liste vous dit
      ce qu'il reste à saisir, avec un lien vers chaque écran.
    status: en-test
    since: 0.78.0
  - id: assolement
    module: activites
    title: Assolement prévisionnel sur la carte
    text: >-
      Préparez la campagne suivante parcelle par parcelle, sur la carte ou en liste :
      culture principale, dérobée, couvert, découpe ou fusion de parcelles à une date
      donnée. Les contrôles s'affichent pendant que vous affectez (BCAE 7, délais de retour
      entre cultures, règles bio et HVE, zones non traitées, captages, Natura 2000). Une fois
      validé, l'assolement crée les productions de la campagne et garde ses versions.
    status: disponible
    capture: assolement
    since: 0.147.0
  - id: itk-ferme
    module: activites
    title: Itinéraires techniques de la ferme
    text: >-
      Les itinéraires de vos cultures, tirés de vos interventions des campagnes passées :
      étapes datées par rapport au semis ou à la récolte, produits et doses, matériels et
      débits observés. Ils se corrigent dans un éditeur, se dupliquent, et s'affectent aux
      parcelles dans l'assolement.
    status: disponible
    capture: itk
    since: 0.160.0
  - id: temps-travaux
    module: activites
    title: Temps de travaux et pointes de la campagne
    text: >-
      Les heures de chaque chantier prévu, d'après le débit de vos matériels ou le barème
      BCMA des coûts des façons culturales, plus les trajets entre le siège et les parcelles
      calculés sur la route pour un tracteur. Les heures se cumulent par semaine pour faire
      voir les pointes face aux personnes disponibles.
    status: disponible
    capture: temps-travaux
    since: 0.163.0
  - id: interventions-prevues
    module: interventions
    title: Interventions prévues depuis l'assolement
    text: >-
      Quand vous le demandez, les itinéraires affectés deviennent des interventions
      planifiées de la campagne, proposées puis confirmées une à une, avec les contrôles de
      la saisie. Un assolement modifié ensuite les met à jour sans toucher à ce qui est fait.
    status: disponible
    since: 0.162.0
  - id: prix
    module: economie
    title: Prix de la ferme et prix de référence
    text: >-
      Prix de vente, prix des intrants, coût horaire de la main-d'œuvre et coûts des
      matériels, datés : un changement de prix n'efface pas l'ancien. Fourmy propose des
      références à reprendre en un clic : prix des productions et rendements de référence,
      cotations européennes et MATIF, prix indicatifs des engrais, produits phyto et
      semences du référentiel Lexicon.
    status: disponible
    since: 0.166.0
  - id: marges
    module: economie
    title: Marges prévisionnelles de l'assolement
    text: >-
      Pour chaque activité de l'assolement : produit attendu (rendement de la ferme ou de
      référence, prix de vente), charges d'intrants, de matériel et de main-d'œuvre tirées
      des itinéraires, jusqu'à la marge directe, à l'hectare et au total. Ce qui manque est
      listé plutôt que compté à zéro, et la campagne précédente réalisée sert de comparaison.
    status: disponible
    capture: marges
    since: 0.169.0
  - id: semences
    module: stocks
    title: Semences
    text: >-
      Chaque semence avec son espèce, sa variété du catalogue officiel, son conditionnement
      et son poids de mille grains, avec des repères quand il manque. Le semis se saisit en
      grains au mètre carré, en kilos à l'hectare ou en doses, et le stock suit ; les
      mélanges de couverts se dosent espèce par espèce. Utilisation par campagne exportable.
    status: disponible
    capture: semences
    since: 0.155.0
  - id: besoins-intrants
    module: stocks
    title: Besoins en intrants de la campagne
    text: >-
      Les quantités d'engrais, de produits phyto et de semences qu'appelle l'assolement
      prévu, comparées aux stocks : ce qu'il reste à commander, produit par produit.
    status: disponible
    since: 0.164.0
  - id: controle-hve
    module: reglementaire
    title: Contrôle HVE
    text: >-
      Les quatre indicateurs de la certification environnementale calculés depuis vos
      parcelles et vos interventions : biodiversité, stratégie phytosanitaire, fertilisation
      et irrigation, avec le questionnaire de l'année et un feu à la saisie quand une
      intervention fait perdre des points. Liasse exportée pour l'auditeur ; la grille
      officielle remplie est à venir.
    status: disponible
    since: 0.132.0
  - id: controle-ab
    module: reglementaire
    title: Contrôle Agriculture biologique
    text: >-
      Les règles du règlement bio vérifiées sur les parcelles certifiées : conversion,
      produits phyto et fertilisants autorisés, cuivre, 170 kg d'azote, semences et
      dérogations, mixité, matériel partagé, rotation. Ce qui ne se contrôle pas depuis les
      données est dit « non contrôlé ». Registre bio exporté.
    status: disponible
    since: 0.133.0
  - id: traces
    module: materiels
    title: Traces GPS des tracteurs
    text: >-
      Reliez vos boîtiers Traccar : les trajets arrivent chaque minute, et la surface
      réellement travaillée est calculée.
    status: disponible
    capture: integrations
    since: 0.22.0
  - id: parcours
    module: materiels
    title: Parcours GPS transformés en interventions
    text: >-
      Chaque matériel suivi a son onglet Parcours : les chantiers et les déplacements de
      la trace, avec parcelles, surface couverte et carte. Cochez les parcours d'une
      journée : l'intervention se pré-remplit avec l'attelage, les horaires et les
      parcelles travaillées. Le tableau de bord résume les parcours du jour ou de la
      semaine et signale ceux qui restent à saisir.
    status: disponible
    capture: parcours
    since: 0.57.0
  - id: attelages
    module: interventions
    title: Attelages tracteur, outils et conducteur
    text: >-
      Déclarez une intervention par attelages : chaque tracteur avec ses outils, son
      conducteur et ses propres heures, deux chantiers en même temps compris. Vos
      attelages habituels se reprennent en un clic, et le registre phyto indique
      l'applicateur : le conducteur de l'attelage qui porte le pulvérisateur.
    status: disponible
    since: 0.54.0
  - id: materiels
    module: materiels
    title: Matériels et relevés d'heures
    text: >-
      La fiche de chaque matériel : identité, moteur et boîte, options, fiche technique,
      logo. Les heures se relèvent en deux gestes, au bureau ou au hangar ; une valeur
      plus basse que la précédente est refusée, sauf correction motivée. Avec Traccar,
      les heures de chaque journée de travail s'ajoutent toutes seules.
    status: disponible
    capture: materiels
    since: 0.42.0
  - id: entretien
    module: materiels
    title: Plan d'entretien et échéances
    text: >-
      Le plan d'entretien du constructeur repris pour chaque tracteur : vidanges, filtres,
      graissages, contrôles, à faire toutes les 500 heures ou tous les 12 mois. Fourmy
      montre ce qui est en retard ou à venir, prépare la saisie avec les bonnes pièces,
      liste les pièces à commander et prévient par e-mail.
    status: en-test
    since: 0.43.0
  - id: avatar-3d
    module: materiels
    title: Un avatar 3D pour chaque matériel
    text: >-
      Chaque tracteur a son avatar à ses dimensions, à ses couleurs et avec son logo, et
      chaque outil sa forme selon son type — semoir, herse, charrue, pulvérisateur avec sa
      rampe à la bonne largeur. Ils parcourent le plan 3D au rejeu des traces GPS.
    status: disponible
    capture: avatar-3d
    since: 0.46.0
  - id: mobile
    module: interventions
    title: Application mobile hors ligne
    text: >-
      Saisie au champ sans réseau, envoi au retour de la connexion, intervention par
      intervention, attelages compris. Chacun y retrouve sa fiche et ses heures.
    status: en-test
    since: 0.21.0
  - id: equipe
    module: ferme
    title: Équipe, fiches et temps de travaux
    text: >-
      Une fiche par personne, avec ou sans compte : photo, coordonnées réservées au
      responsable et à la personne, contrat, Certiphyto et son échéance. Ses heures
      viennent des interventions saisies, par mois, par culture et par type de travail.
      Une invitation par email ou par lien lui ouvre un compte ; le rôle « lecture seule »
      convient au conseiller ou au comptable.
    status: disponible
    capture: equipe-temps
    since: 0.20.0
  - id: agrirouter
    module: interoperabilite
    title: Les machines reliées par agrirouter
    text: >-
      Reliez Fourmy à agrirouter : les cartes de modulation partent vers les consoles, et
      reviennent les travaux réalisés, proposés comme interventions à valider, et la
      télémétrie des machines, versée dans les parcours GPS. Un envoi attend le retour de
      la connexion si agrirouter ne répond pas.
    status: en-test
    since: 0.114.0
  - id: ma-ferme
    module: ferme
    title: Ma ferme, sites et cartes hors ligne
    text: >-
      La fiche de l'exploitation (identité, certifications, logo sur les documents), ses
      sites, et les fonds de carte IGN gardés sur le serveur : la ferme se consulte même
      sans réseau, dans le navigateur.
    status: disponible
    since: 0.99.0
  - id: reprise
    module: interoperabilite
    title: Reprise de vos données Ekylibre
    text: >-
      Parcelles, interventions, stocks, cuves et personnes repris d'Ekylibre ; le registre
      phytosanitaire reste identique à l'original, et un nouvel import ne remplace jamais
      ce que vous avez saisi dans Fourmy.
    status: disponible
    since: 0.9.0
  - id: imports
    module: interoperabilite
    title: Import DAPLOS, Geofolia et TéléPAC
    text: >-
      Reprenez vos campagnes passées depuis un autre logiciel : fichiers d'échange DAPLOS,
      export Geofolia et dossier TéléPAC, sur cinq campagnes. Les cultures et les produits
      sont reconnus, les doublons entre fichiers écartés, et un import se défait en entier.
    status: disponible
    since: 0.127.0
  - id: assistant
    module: ferme
    title: Assistant de premier démarrage
    text: >-
      À la création de la ferme, un assistant guide les premières étapes : identité
      pré-remplie (annuaire Sirene ou vos fichiers), dépôt de vos fichiers, rapprochement des
      cultures, des personnes et des produits, ou reprise d'une sauvegarde Ekylibre.
    status: disponible
    since: 0.131.0
  - id: stations-meteo
    module: interoperabilite
    title: Vos stations météo Weenat et Sencrop
    text: >-
      Reliez votre compte Weenat ou Sencrop : les mesures de vos stations arrivent toutes
      les heures, et la météo d'une intervention passée vient de la station la plus
      proche des parcelles plutôt que d'un modèle.
    status: en-test
    since: 0.67.0
  - id: capteurs
    module: interoperabilite
    title: Sondes et pièges connectés
    text: >-
      Sondes et pièges reliés comme les traceurs GPS et les stations météo, relevés
      rattachés aux parcelles.
    status: a-venir
