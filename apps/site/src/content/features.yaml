# Fonctionnalités présentées sur fourmy.org (page Fonctionnalités et accueil).
# status : disponible | en-test | a-venir ; capture : src/assets/captures/<capture>.png
# (régénérées par `pnpm --filter @fourmy/site captures`) ; since : version d'arrivée.
features:
  - id: frise
    title: La ferme à n'importe quelle date
    text: >-
      Une frise en haut de l'écran : faites-la glisser et toute la ferme revient à cette
      date — parcelles, cuves, stocks, interventions. Rien n'est écrasé, tout est daté.
    status: disponible
    capture: tableau-de-bord
    since: 0.17.0
  - id: carte
    title: Carte et parcellaire dans le temps
    text: >-
      Parcelles sur la photo aérienne et la carte IGN, versionnées : une parcelle découpée
      ou agrandie garde son histoire, et les surfaces traitées restent justes.
    status: disponible
    capture: carte
    since: 0.8.0
  - id: plan-3d
    title: Plan 3D de l'exploitation
    text: >-
      Relief et photo IGN, bâtiments à leur hauteur, cuves qui se remplissent au fil des
      vendanges, NDVI des parcelles, et rejeu des passages de tracteurs : la caméra suit
      l'avatar 3D du tracteur et de son outil attelé, ou survole la ferme comme un drone,
      pendant que le tracé de la journée se dessine. Les trajets sur route suivent la
      route, et une barre de temps place le rejeu à l'instant voulu, en plein écran.
    status: disponible
    capture: accueil-3d
    since: 0.18.0
  - id: satellite
    title: Suivi des cultures par satellite
    text: >-
      NDVI, NDRE et NDMI de chaque parcelle d'après les images Sentinel-2, avec votre compte
      Copernicus : courbe de la saison comparée aux années passées, image sur la carte, et
      signalement des parcelles probablement récoltées sans intervention saisie.
    status: en-test
    since: 0.68.0
  - id: croissance
    title: Stades et besoins en eau des cultures
    text: >-
      Les stades du maïs et des céréales prévus d'après les degrés-jours depuis le semis, et
      la réserve en eau de chaque parcelle jour après jour. Les irrigations se saisissent en
      millimètres et entrent dans le bilan.
    status: en-test
    since: 0.72.0
  - id: modulation
    title: Cartes de modulation pour la console du tracteur
    text: >-
      Des zones tirées de l'image satellite, une dose par zone, puis l'export ISO-XML ou
      Shapefile, ou l'envoi par agrirouter. Depuis le plan de fumure, la carte garde la dose
      prévue en moyenne sur la parcelle.
    status: en-test
    since: 0.74.0
  - id: interventions
    title: Toutes les interventions, un seul formulaire
    text: >-
      Labour, semis, traitements, fertilisation, récolte, vendange, entretien du matériel :
      le formulaire s'adapte à ce que vous faites, chaque travail a son icône. Doses à
      l'hectare ou au total, engrais en kilos ou en litres, plusieurs périodes de travail,
      vos produits et matériels habituels proposés en premier. Utilisable sur téléphone, et
      rien ne se perd si le réseau coupe pendant l'enregistrement.
    status: disponible
    capture: intervention
    since: 0.19.0
  - id: interventions-carte
    title: Les parcelles choisies sur la carte
    text: >-
      Cliquez les parcelles sur la photo aérienne, ou prenez-les toutes d'un geste ; dessinez
      la zone réellement traitée quand une parcelle ne l'est qu'en partie : la dose totale
      suit la surface exacte.
    status: disponible
    capture: intervention-carte
    since: 0.33.0
  - id: interventions-semaine
    title: La semaine des travaux
    text: >-
      Les interventions de la semaine en liste, en kanban (planifiées, en cours, réalisées)
      ou en calendrier ; une recherche rapide retrouve un produit, une parcelle ou un
      matériel sur toute la campagne. Chaque liste de Fourmy se règle : vous choisissez
      les colonnes affichées.
    status: disponible
    capture: interventions-semaine
    since: 0.31.0
  - id: interventions-fiche
    title: Fiche d'intervention et corrections tracées
    text: >-
      Chaque intervention a sa fiche : parcelles, doses à l'hectare et au total, matériels,
      trace GPS. Une erreur de saisie se corrige ; le stock et le registre suivent, et
      l'historique garde la version d'avant.
    status: disponible
    capture: intervention-fiche
    since: 0.30.0
  - id: controle-phyto
    title: Contrôle réglementaire des traitements
    text: >-
      En saisissant un traitement, Fourmy vérifie l'autorisation du produit sur la culture,
      la dose maximale, le nombre d'applications, la zone non traitée au bord des cours
      d'eau et les délais avant récolte et de ré-entrée, d'après le catalogue officiel
      E-Phy. Un feu rouge demande un motif, conservé avec l'intervention.
    status: disponible
    capture: controle-phyto
    since: 0.34.0
  - id: meteo-interventions
    title: Météo des interventions
    text: >-
      La météo de chaque intervention est remplie toute seule (température, hygrométrie,
      vent, pluie), et les créneaux favorables à la pulvérisation des prochains jours
      s'affichent. Open-Meteo par défaut, ou votre clé OpenWeather ou meteoblue.
    status: disponible
    capture: meteo
    since: 0.35.0
  - id: stocks
    title: Stocks tenus tout seuls
    text: >-
      Chaque intervention réalisée sort les produits du stock ; une récolte y entre, rangée
      en cuve ou au bâtiment. Un stock négatif est signalé, jamais caché.
    status: disponible
    capture: stocks
    since: 0.14.0
  - id: cuverie
    title: Cuverie
    text: >-
      Chaque cuve, ce qu'elle contient, son millésime et son cépage, à n'importe quelle date.
    status: disponible
    capture: cuverie
    since: 0.17.0
  - id: registre
    title: Registre phytosanitaire et IFT calculés
    text: >-
      Le registre se déduit des traitements saisis : rien à ressaisir. Export pour les
      contrôles, et l'IFT de la campagne calculé par le service du ministère.
    status: disponible
    capture: registre
    since: 0.7.0
  - id: registre-reglementaire
    title: Registre phyto au format réglementaire 2027
    text: >-
      Le registre électronique tel que l'attend l'arrêté du 24 décembre 2025 : une ligne
      par produit et par parcelle, culture en code OEPP, stade BBCH, applicateur, mode de
      conduite bio, SIRET du détenteur. Les champs manquants sont signalés ligne par
      ligne ; export CSV aux intitulés officiels et JSON complet pour les enquêtes.
    status: disponible
    capture: registre-reglementaire
    since: 0.66.0
  - id: plan-fumure
    title: Plan prévisionnel de fumure calculé
    text: >-
      La dose d'azote de chaque parcelle selon le référentiel régional, terme par terme et
      sources citées : besoin de la culture, reliquat, minéralisation, produits organiques.
      Maïs, céréales à paille et colza ; dose plafond pour les autres cultures. Un terme
      manquant est nommé, rien n'est supposé. La dose d'un outil ou d'un conseiller peut
      la remplacer, et chaque version établie reste figée. Nouvelle-Aquitaine pour commencer.
    status: en-test
    since: 0.77.0
  - id: cahier-fertilisation
    title: Cahier de fertilisation et directive nitrates
    text: >-
      Le cahier d'enregistrement se déduit des interventions, prêt à imprimer ou en CSV,
      apports d'automne compris. À la
      saisie d'un épandage, Fourmy vérifie le calendrier d'interdiction, le plan, les
      couverts d'interculture, l'azote libéré avant l'hiver et les conditions du jour ; un
      épandage interdit demande un motif, conservé avec l'intervention. Une liste vous dit
      ce qu'il reste à saisir, avec un lien vers chaque écran.
    status: en-test
    since: 0.78.0
  - id: traces
    title: Traces GPS des tracteurs
    text: >-
      Reliez vos boîtiers Traccar : les trajets arrivent chaque minute, et la surface
      réellement travaillée est calculée.
    status: disponible
    capture: integrations
    since: 0.22.0
  - id: parcours
    title: Parcours GPS transformés en interventions
    text: >-
      Chaque matériel suivi a son onglet Parcours : les chantiers et les déplacements de
      la trace, avec parcelles, surface couverte et carte. Cochez les parcours d'une
      journée : l'intervention se pré-remplit avec l'attelage, les horaires et les
      parcelles travaillées. Le tableau de bord résume les parcours du jour ou de la
      semaine et signale ceux qui restent à saisir.
    status: disponible
    capture: parcours
    since: 0.57.0
  - id: attelages
    title: Attelages tracteur, outils et conducteur
    text: >-
      Déclarez une intervention par attelages : chaque tracteur avec ses outils, son
      conducteur et ses propres heures, deux chantiers en même temps compris. Vos
      attelages habituels se reprennent en un clic, et le registre phyto indique
      l'applicateur : le conducteur de l'attelage qui porte le pulvérisateur.
    status: disponible
    since: 0.54.0
  - id: materiels
    title: Matériels et relevés d'heures
    text: >-
      La fiche de chaque matériel : identité, moteur et boîte, options, fiche technique,
      logo. Les heures se relèvent en deux gestes, au bureau ou au hangar ; une valeur
      plus basse que la précédente est refusée, sauf correction motivée. Avec Traccar,
      les heures de chaque journée de travail s'ajoutent toutes seules.
    status: disponible
    capture: materiels
    since: 0.42.0
  - id: entretien
    title: Plan d'entretien et échéances
    text: >-
      Le plan d'entretien du constructeur repris pour chaque tracteur : vidanges, filtres,
      graissages, contrôles, à faire toutes les 500 heures ou tous les 12 mois. Fourmy
      montre ce qui est en retard ou à venir, prépare la saisie avec les bonnes pièces,
      liste les pièces à commander et prévient par e-mail.
    status: en-test
    since: 0.43.0
  - id: avatar-3d
    title: Un avatar 3D pour chaque matériel
    text: >-
      Chaque tracteur a son avatar à ses dimensions, à ses couleurs et avec son logo, et
      chaque outil sa forme selon son type — semoir, herse, charrue, pulvérisateur avec sa
      rampe à la bonne largeur. Ils parcourent le plan 3D au rejeu des traces GPS.
    status: disponible
    capture: avatar-3d
    since: 0.46.0
  - id: mobile
    title: Application mobile hors ligne
    text: >-
      Saisie au champ sans réseau, envoi au retour de la connexion, intervention par
      intervention.
    status: en-test
    since: 0.21.0
  - id: equipe
    title: Équipe, fiches et temps de travaux
    text: >-
      Une fiche par personne, avec ou sans compte : photo, coordonnées réservées au
      responsable et à la personne, contrat, Certiphyto et son échéance. Ses heures
      viennent des interventions saisies, par mois, par culture et par type de travail.
      Une invitation par email ou par lien lui ouvre un compte ; le rôle « lecture seule »
      convient au conseiller ou au comptable.
    status: disponible
    capture: equipe-temps
    since: 0.20.0
  - id: reprise
    title: Reprise de vos données Ekylibre
    text: >-
      Parcelles, interventions, stocks, cuves et personnes repris d'Ekylibre ; le registre
      phytosanitaire reste identique à l'original, et un nouvel import ne remplace jamais
      ce que vous avez saisi dans Fourmy.
    status: disponible
    since: 0.9.0
  - id: stations-meteo
    title: Vos stations météo Weenat et Sencrop
    text: >-
      Reliez votre compte Weenat ou Sencrop : les mesures de vos stations arrivent toutes
      les heures, et la météo d'une intervention passée vient de la station la plus
      proche des parcelles plutôt que d'un modèle.
    status: en-test
    since: 0.67.0
  - id: capteurs
    title: Sondes et pièges connectés
    text: >-
      Sondes et pièges reliés comme les traceurs GPS et les stations météo, relevés
      rattachés aux parcelles.
    status: a-venir
