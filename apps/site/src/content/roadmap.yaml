# Roadmap publique (page Roadmap). status : en-cours | prochainement | plus-tard.
# Version publique, à valider (docs/site-public-exigences.md, question 5), tirée de la
# roadmap GitHub (projet « Fourmy — Roadmap », claudedocs/points_ouverts.md) : sans noms
# de fermes ni détails internes.
roadmap:
  - title: Tests avec les fermes pilotes
    text: >-
      Une grande culture et un domaine viticole utilisent Fourmy sur leurs propres données,
      reprises d'Ekylibre. Recette complète faite en novembre 2026 avant l'envoi à la
      première ferme : écrans, rôles, réglementaire, téléphone.
    status: en-cours
    horizon: Fin 2026
  - title: Application mobile sur le terrain
    text: >-
      Essais sur téléphone, cartes hors ligne, interventions en attelages, puis diffusion
      aux pilotes.
    status: en-cours
    horizon: Fin 2026
  - title: Mise en production
    text: Hébergement de production, sauvegardes, ouverture aux premières fermes.
    status: prochainement
    horizon: Début 2027
  - title: Outils de relief
    text: Profil d'un trajet, pente, ombrage et courbes de niveau sur la carte et le plan 3D.
    status: prochainement
  - title: Cartes de modulation sur le tracteur
    text: >-
      Envoi des cartes aux consoles par agrirouter essayé en conditions réelles, puis retour
      des doses réellement appliquées.
    status: prochainement
  - title: Registre phytosanitaire en PDF
    text: Le registre prêt à imprimer pour les contrôles.
    status: prochainement
  - title: Documents et photos des matériels
    text: Notices, carte grise, contrôle technique et photos joints à chaque matériel et à ses entretiens.
    status: prochainement
  - title: Heures des matériels par d'autres boîtiers
    text: Karnott, télématique des constructeurs, en plus de Traccar.
    status: plus-tard
  - title: Stations météo chez les pilotes
    text: Weenat et Sencrop validés sur de vrais comptes, en conditions réelles.
    status: prochainement
  - title: Registre phyto complet
    text: >-
      Serres fermées et locaux de stockage, semences traitées, prestations de service et
      délai de rentrée : les cas restants de l'arrêté de décembre 2025.
    status: prochainement
  - title: Outil de dose azotée labellisé
    text: >-
      Labellisation COMIFER du calcul de dose, exigée en Nouvelle-Aquitaine après la période
      de tolérance qui se termine en août 2027.
    status: prochainement
    horizon: Été 2027
  - title: Fertilisation dans les autres régions
    text: >-
      Référentiels régionaux des autres régions, rôle conseiller pour proposer les plans,
      contrôles de l'épandage sur le mobile hors ligne.
    status: plus-tard
  - title: Viticulture et élevage
    text: >-
      Déclaration de récolte, registre de cave et parcellaire viticole ; suivi des animaux
      par lots, puis individuel.
    status: plus-tard
  - title: Sondes et pièges connectés
    text: De nouvelles intégrations sur le modèle des traceurs GPS et des stations météo.
    status: plus-tard
  - title: API documentée et ouverte
    text: >-
      Documentation de l'API pour les partenaires et les outils comme Aiffel, l'assistant
      agricole.
    status: plus-tard
  - title: Comptabilité avec Lyvre
    text: Les interventions et les stocks transmis à la comptabilité tenue dans Lyvre.
    status: plus-tard
